name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ooty-widget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ooty-widget.apk \
            --title "Programme Ooty (build ${{ github.run_number }})" \
            --notes "Télécharge ooty-widget.apk sur ton téléphone et installe-le." \
            --target ${{ github.sha }}
